version: "3.7"
services:
  {{ cookiecutter.__project_slug }}:
    container_name: {{ cookiecutter.__project_slug }}
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/data:rw,z
    networks:
      - {{ cookiecutter.__project_slug }}

    # Security
    cap_drop:
      - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  {{ cookiecutter.__project_slug }}:
    driver: bridge

volumes:
  logs:
